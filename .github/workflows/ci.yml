name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # 타입체크 + 테스트. 빌드가 통과해도 테스트가 깨지면 여기서 멈춘다.
      - run: npm run check
      - run: npm run build
